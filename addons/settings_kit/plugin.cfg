[plugin]

name="Settings Kit"
description="Game-agnostic settings persistence (graphics/audio/gameplay/controller/locale), key & gamepad rebinding to disk, and a reusable rebind-row UI. Pairs with the Game Core addon. Provides the SettingsManager base class; your game's settings autoload extends it and supplies the rebindable action list."
author="godot-game-kit"
version="1.0.0"
script="settings_kit.gd"
