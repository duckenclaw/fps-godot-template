[plugin]

name="Inventory Kit"
description="Game-agnostic item & inventory model: ItemResource data, an ItemDB id registry, a grid Inventory with stacking/quick-slots, and InventorySlot. Pure data/logic with no 2D/3D dependency, reusable across any genre. UI is left to each game."
author="godot-game-kit"
version="1.0.0"
script="inventory_kit.gd"
