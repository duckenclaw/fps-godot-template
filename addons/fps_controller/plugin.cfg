[plugin]

name="FPS Controller"
description="First-person character controller: state-based movement (walk/sprint/crouch/slide/dash/wallrun), mouse+gamepad camera with head-bob/tilt/FOV/shake, a hands viewmodel system, a grab controller for physics objects, a projectile, and example world props. Depends on the Core, Components and Inventory kits. This is the FPS template's genre layer."
author="godot-game-kit"
version="1.0.0"
script="fps_controller.gd"
